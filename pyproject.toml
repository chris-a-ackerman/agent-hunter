[project]
name = "agent-hunter"
version = "0.1.0"
description = "Trial-then-Hire: test agents on your job before you hire one"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-hunter-contracts",
    "agent-hunter-gateway",
    "faker>=40.43.0",
    "jinja2>=3.1.6",
    "pypdfium2>=5.14.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts", "gateway"]

[tool.uv.sources]
agent-hunter-contracts = { workspace = true }
agent-hunter-gateway = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: makes real model calls through Parley (costs money; run explicitly with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "core", "gateway", "mocks", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "contracts/src:gateway/src"
plugins = ["pydantic.mypy"]
