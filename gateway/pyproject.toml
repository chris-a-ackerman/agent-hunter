[project]
name = "agent-hunter-gateway"
version = "0.1.0"
description = "Model gateway for Agent-Hunter: every LLM call goes through MIT Parley with a cost log and budget guard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
